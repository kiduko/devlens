<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Lens ring -->
  <circle cx="50" cy="48" r="20" fill="none" stroke="#fff" stroke-width="6.5"/>
  <!-- Lens handle -->
  <line x1="64" y1="62" x2="82" y2="80" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Lens glint -->
  <circle cx="42" cy="40" r="4" fill="rgba(255,255,255,0.5)"/>
  <!-- Code brackets -->
  <g fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="42,94 32,104 42,114"/>
    <polyline points="86,94 96,104 86,114"/>
    <line x1="58" y1="92" x2="70" y2="116"/>
  </g>
</svg>
