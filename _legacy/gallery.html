<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevLens Gallery</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <svg class="header-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span class="header-title">DevLens Gallery</span>
      <span class="file-count" id="fileCount">0</span>
    </div>
    <div class="header-right">
      <input type="search" class="search-input" id="searchInput" placeholder="검색...">
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-left">
      <input type="date" class="filter-date" id="filterDate">
      <select class="filter-select" id="filterSite">
        <option value="">모든 사이트</option>
      </select>
      <select class="filter-select" id="sortBy">
        <option value="newest">최신순</option>
        <option value="oldest">오래된순</option>
        <option value="largest">큰 파일순</option>
        <option value="site">사이트별</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button class="view-btn active" id="btnGridView" title="그리드 뷰">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
      <button class="view-btn" id="btnListView" title="리스트 뷰">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
      </button>
      <button class="clear-btn" id="btnClearAll" title="전체 기록 삭제">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
        삭제
      </button>
    </div>
  </div>

  <main class="gallery" id="gallery">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <p class="empty-title">다운로드 기록이 없습니다</p>
      <p class="empty-desc">DevLens로 이미지를 저장하면 여기에 표시됩니다</p>
    </div>
  </main>

  <script src="gallery.js"></script>
</body>
</html>
